name: Luna CPU deterministic terminology 20261006
run-name: Luna CPU deterministic terminology at ${{ github.sha }}
on:
  push:
    branches: ['experiment/luna-actions-lexical-20261005']
    paths: ['.github/workflows/luna-term-lock-cpu-v1.yml']
permissions:
  contents: read
concurrency:
  group: luna-actions-term-lock-cpu-20261006-v1
  cancel-in-progress: false
jobs:
  term_lock:
    if: >-
      github.repository == 'yuxixi311/LunaTranslator-UI-Custom' &&
      github.event.repository.private == false && github.event_name == 'push' &&
      github.ref == 'refs/heads/experiment/luna-actions-lexical-20261005' &&
      github.event.before == '882b7066bb8e0a569b60e5768ce949c14f4822c9' &&
      github.event.created == false && github.event.deleted == false &&
      github.event.forced == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LUNA_SOURCE_COMMIT: '882b7066bb8e0a569b60e5768ce949c14f4822c9'
      LUNA_MANIFEST_SHA: '505eb9a67fe86634168934c403fddf7321fc1da4169e498288e3782e23e24de4'
      LUNA_BOOTSTRAP_SHA: '48015394c44d37bb6f47c526afcb1b421881e4067065807074a92772782bc5d6'
      LUNA_PROJECT: tools/local_eval/actions-term-cpu-v1
      PYTHONDONTWRITEBYTECODE: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          show-progress: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/local_eval/actions-term-cpu-v1/
            /.github/workflows/luna-term-lock-cpu-v1.yml
      - name: Validate exact source and perform the fixed attempt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$LUNA_BOOTSTRAP_SHA" "$LUNA_PROJECT/verified_bootstrap.py" | sha256sum --check --status
          /usr/bin/python3 -I -B "$GITHUB_WORKSPACE/$LUNA_PROJECT/verified_bootstrap.py" "$GITHUB_WORKSPACE/$LUNA_PROJECT/KIT_MANIFEST.json" "$LUNA_MANIFEST_SHA" actions unused
